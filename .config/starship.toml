format = """
[](current_line)\
$os\
$username\
[](bg:purple fg:current_line)\
$directory\
[](bg:orange fg:purple)\
$git_branch\
$git_status\
[](fg:orange bg:cyan)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:cyan bg:red)\
$conda\
[](fg:red bg:pink)\
$time\
[ ](fg:pink)\
$cmd_duration\
$line_break\
$character"""

palette = 'dracula'

[os]
disabled = false
style = "bg:current_line fg:foreground"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
# Fedora = "󰣛"
Fedora = "󱄛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
CachyOS = "󰣇"

[username]
show_always = true
style_user = "bg:current_line fg:foreground"
style_root = "bg:red fg:foreground"
format = '[ $user]($style)'

[directory]
style = "bg:purple fg:background"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:orange"
format = '[[ $symbol $branch ](fg:background bg:orange)]($style)'

[git_status]
style = "bg:orange"
format = '[[($all_status$ahead_behind )](fg:background bg:orange)]($style)'

# Lenguajes — bloque técnico unificado
[nodejs]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[c]
symbol = " "
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[rust]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[golang]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[php]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[java]
symbol = " "
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[kotlin]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[haskell]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version) ](fg:background bg:cyan)]($style)'

[python]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:background bg:cyan)]($style)'

[conda]
symbol = "  "
style = "fg:background bg:red"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:pink"
format = '[[  $time ](fg:background bg:pink)]($style)'

[cmd_duration]
show_milliseconds = true
format = " $duration "
style = "fg:comment"
disabled = false

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[λ ❯](bold fg:green)'
error_symbol = '[λ ❯](bold fg:red)'
vimcmd_symbol = '[λ ❮](bold fg:green)'
vimcmd_replace_one_symbol = '[λ ❮](bold fg:purple)'
vimcmd_replace_symbol = '[λ ❮](bold fg:purple)'
vimcmd_visual_symbol = '[λ ❮](bold fg:yellow)'


[palettes.dracula]
# Colores de fondo
background = "#282a36"
current_line = "#44475a"
selection = "#44475a"

# Colores de texto
foreground = "#f8f8f2"
comment = "#6272a4"

# Colores principales (los más usados)
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

# Extras útiles
white = "#f8f8f2"
gray = "#6272a4"
dark_gray = "#44475a"
black = "#282a36"

# Para transparencia/overlays
overlay0 = "#44475a"
overlay1 = "#6272a4"
overlay2 = "#8be9fd"


